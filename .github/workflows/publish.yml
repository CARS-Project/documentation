# Render the book and publish it to GitHub Pages (the gh-pages branch).
#
# Chapters are executed locally and their results committed in _freeze/, so
# this workflow needs Quarto only: no R, and no access to MOT-pipline or the
# vehicle table. See chapters/maintaining.qmd.

on:
  workflow_dispatch:
  push:
    branches: main

name: Publish book

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
